services:
  db:
    image: postgres:17-alpine
    container_name: lush_database
    restart: always
    environment:
      POSTGRES_USER: 'lush'
      POSTGRES_PASSWORD: 'SOAP>REST'
      POSTGRES_DB: 'project_management'
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydatabase"]
      interval: 10s
      timeout: 5s
      retries: 5
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DB_URL: postgresql+asyncpg://lush:SOAP>REST@db:5432/project_management
      RATE_LIMITING_ENABLED: "true"
    depends_on:
      db:
        condition: service_healthy
  migrate:
    build: .
    command: uv run alembic upgrade head
    environment:
      DB_URL: postgresql+asyncpg://lush:SOAP>REST@db:5432/project_management
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: