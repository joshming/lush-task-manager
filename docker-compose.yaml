services:
  db:
    image: postgres:17-alpine
    container_name: postgres_17
    restart: always
    environment:
      POSTGRES_USER: 'lush'
      POSTGRES_PASSWORD: 'SOAP>REST'
      POSTGRES_DB: 'project_management'
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydatabase"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: