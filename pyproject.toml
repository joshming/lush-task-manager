[project]
name = "lush-task-manager"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.138.2",
    "uvicorn>=0.49.0",
    "strawberry-graphql[fastapi]>=0.320.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.18.5",
    "greenlet>=3.5.3",
    "asyncpg>=0.31.0",
    "pydantic>=2.13.4",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.32",
    "python-dotenv>=1.2.2",
    "slowapi>=0.1.9",
    "limits>=3.6.0",
    "starlette>=1.3.1",
    "pytest-env>=1.3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "aiosqlite>=0.22.1",
    "httpx>=0.27.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
env = [
    "RATE_LIMITING_ENABLED=false"
]
